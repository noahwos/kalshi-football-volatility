name: Open analyzer pull request

on:
  push:
    branches: [feature/football-volatility-analyzer]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: analyzer-pull-request
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.repository == 'noahwos/kalshi-football-volatility' && github.ref == 'refs/heads/feature/football-volatility-analyzer' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[open-pr]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_gh() {
            if gh "$@" 2> "$RUNNER_TEMP/fva-pr-error.txt"; then
              return 0
            fi
            while IFS= read -r line; do
              printf '::error title=GitHub PR request failed::%s\n' "$line" >&2
            done < "$RUNNER_TEMP/fva-pr-error.txt"
            return 1
          }
          branch=feature/football-volatility-analyzer
          pr_url=$(run_gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$pr_url" ]; then
            run_gh pr edit "$pr_url" --title 'Add football volatility analyzer with an offline dashboard' --body-file docs/PR_DESCRIPTION.md
          else
            pr_url=$(run_gh pr create --base main --head "$branch" \
              --title 'Add football volatility analyzer with an offline dashboard' \
              --body-file docs/PR_DESCRIPTION.md)
          fi
          printf 'Pull request: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
