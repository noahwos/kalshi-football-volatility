name: Tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Install browser test tools
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Exercise dashboard interactions
        if: matrix.python-version == '3.12'
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python scripts/build_dashboard_fixture.py "$RUNNER_TEMP/fva-browser-fixture"
          python scripts/check_dashboard_browser.py "$RUNNER_TEMP/fva-browser-fixture/dashboard.html"
